<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video</title>
</head>
<body style="text-align:center; margin-top:60px; font-family:Arial, sans-serif; background:#f5f5f5;">

    <h2>Upload Your Video</h2>

    <label for="videoInput"
        style="display:inline-block;
               padding:15px 25px;
               background:#111;
               color:white;
               border-radius:6px;
               font-weight:bold;
               cursor:pointer;">
        📁 Select Video
    </label>

    <input
        type="file"
        id="videoInput"
        name="video"
        accept="video/*"
        style="display:none;">

    <p id="status" style="color:#555; margin-top:20px; padding:0 20px;"></p>

    <script>
        const input = document.getElementById("videoInput");
        const status = document.getElementById("status");

        function getAdminKey() {
            let key = localStorage.getItem("admin_key");
            if (!key) {
                key = prompt("Admin key daalein (upload karne ke liye):");
                if (key) localStorage.setItem("admin_key", key);
            }
            return key;
        }

        input.addEventListener("change", async () => {
            const file = input.files[0];
            if (!file) return;

            const adminKey = getAdminKey();
            if (!adminKey) {
                status.innerText = "Upload cancel: admin key zaroori hai.";
                input.value = "";
                return;
            }

            const defaultTitle = file.name.replace(/\.[^/.]+$/, "");
            const title = prompt("Video ka title daalein:", defaultTitle) || defaultTitle;

            status.innerText = "Uploading, please wait...";

            const formData = new FormData();
            formData.append("video", file);
            formData.append("title", title);

            try {
                const response = await fetch("/upload", {
                    method: "POST",
                    headers: { "x-admin-key": adminKey },
                    body: formData
                });

                const result = await response.json();

                if (!response.ok) {
                    if (response.status === 403) {
                        localStorage.removeItem("admin_key");
                    }
                    throw new Error(result.error || "Upload failed.");
                }

                status.innerText = "Upload successful! Opening gallery...";
                window.location.href = "gallery.html";

            } catch (err) {
                status.innerText = "Error: " + err.message;
                input.value = "";
            }
        });
    </script>

</body>
</html>
