<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        .top-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .top-bar a {
            display: inline-block;
            padding: 10px 20px;
            background: white;
            color: #111;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .video-card {
            background: #1c1c1c;
            border-radius: 10px;
            padding: 10px;
        }

        .video-title {
            margin: 0 0 10px 0;
            font-size: 16px;
            word-break: break-word;
        }

        video {
            width: 100%;
            border-radius: 10px;
            background: #000;
            display: block;
        }

        .delete-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: #c0392b;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #e74c3c;
        }

        .message {
            text-align: center;
            margin-top: 40px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <div class="top-bar">
        <a href="index.html">⬅ Back to Home</a>
    </div>

    <h1>🎬 Video Gallery</h1>

    <div id="gallery">
        <div class="message">Loading videos...</div>
    </div>

    <script>
        function getAdminKey() {
            let key = localStorage.getItem("admin_key");
            if (!key) {
                key = prompt("Admin key daalein (delete karne ke liye):");
                if (key) localStorage.setItem("admin_key", key);
            }
            return key;
        }

        async function loadVideos() {
            const gallery = document.getElementById("gallery");

            try {
                const response = await fetch("https://clipora-zq0f.onrender.com/api/videos");

                if (!response.ok) {
                    throw new Error("Failed to load videos");
                }

                const videos = await response.json();

                gallery.innerHTML = "";

                if (videos.length === 0) {
                    gallery.innerHTML =
                        '<div class="message">No videos uploaded yet.</div>';
                    return;
                }

                videos.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "video-card";

                    const title = document.createElement("h3");
                    title.className = "video-title";
                    title.textContent = item.title || item.filename;

                    const video=document.createElement("video");
                    video.controls=true;
                    video.preload="auto";
                    video.playsInline=true;
                    video.src="https://clipora-zq0f.onrender.com/videos/" + encodeURIComponent(item.filename) + "?t=" + item.uploadedAt;
                    const deleteBtn = document.createElement("button");
                    deleteBtn.className = "delete-btn";
                    deleteBtn.textContent = "🗑 Delete";

                    deleteBtn.addEventListener("click", async () => {
                        const sure = confirm("Is video ko hamesha ke liye delete karna hai?");
                        if (!sure) return;

                        const adminKey = getAdminKey();
                        if (!adminKey) return;

                        deleteBtn.disabled = true;
                        deleteBtn.textContent = "Deleting...";

                        try {
                            const res = await fetch(
                        
                                "https://clipora-zq0f.onrender.com/api/videos/" + encodeURIComponent(item.filename),
                                {
                                    method: "DELETE",
                                    headers: { "x-admin-key": adminKey }
                                }
                            );

                            if (!res.ok) {
                                if (res.status === 403) {
                                    localStorage.removeItem("admin_key");
                                }
                                throw new Error("Delete failed");
                            }

                            card.remove();

                            if (gallery.children.length === 0) {
                                gallery.innerHTML =
                                    '<div class="message">No videos uploaded yet.</div>';
                            }

                        } catch (err) {
                            alert("Video delete nahi ho payi. Dobara try karein.");
                            deleteBtn.disabled = false;
                            deleteBtn.textContent = "🗑 Delete";
                        }
                    });

                    card.appendChild(title);
                    card.appendChild(video);
                    card.appendChild(deleteBtn);

                const copyBtn = document.createElement("button");
                copyBtn.className = "delete-btn";
                copyBtn.style.background = "#2980b9";
                copyBtn.textContent = "📋 Copy Link";

                copyBtn.addEventListener("click", async () => {
                    const link =
                        window.location.origin +
                        "/video/" +
                        encodeURIComponent(item.filename);

                    await navigator.clipboard.writeText(link);

                    copyBtn.textContent = "✅ Link Copied!";

                    setTimeout(() => {
                        copyBtn.textContent = "📋 Copy Link";
                    }, 2000);
                });

                // Share Button
                const shareBtn = document.createElement("button");
                shareBtn.className = "delete-btn";
                shareBtn.style.background = "#27ae60";
                shareBtn.textContent = "📤 Share";

                shareBtn.addEventListener("click", async () => {
                    const link = window.location.origin + "/video/" + encodeURIComponent(item.filename);

                    if (navigator.share) {
                        try {
                            await navigator.share({
                                title: item.title,
                                text: "Watch this video",
                                url: link
                            });
                        } catch (error) {
                            console.log(error);
                        }
                    } else {
                        await navigator.clipboard.writeText(link);
                        shareBtn.textContent = "✅ Link Copied!";
                        setTimeout(() => {
                            shareBtn.textContent = "📤 Share";
                        }, 2000);
                    }
                });


                // Download Button
                const downloadBtn = document.createElement("button");
                downloadBtn.className = "delete-btn";
                downloadBtn.style.background = "#8e44ad";
                downloadBtn.textContent = "⬇️ Download";

                downloadBtn.addEventListener("click", () => {
                    const link = document.createElement("a");
                    link.href = "/videos/" + encodeURIComponent(item.filename);
                    link.download = item.filename;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                });


                // Add buttons to card
                card.appendChild(copyBtn);
                card.appendChild(shareBtn);
                card.appendChild(downloadBtn);


                // Advertisement Space
                const adBox = document.createElement("div");
                adBox.style.margin = "15px 0";
                adBox.style.padding = "20px";
                adBox.style.textAlign = "center";
                adBox.style.border = "1px dashed #777";
                adBox.style.color = "#888";
                adBox.textContent = "📢 Advertisement";

                card.appendChild(adBox);

                gallery.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                gallery.innerHTML =
                    '<div class="message">Unable to load videos.</div>';
            }
        }

        loadVideos();
    </script>

</body>
</html>
